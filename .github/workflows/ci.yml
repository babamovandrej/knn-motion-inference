name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy knn app tests
      - run: uv run pytest -q
      - run: uv run python -m knn.main

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t knn-motion-inference .
      - run: docker run -d --name api -p 8000:8000 knn-motion-inference
      - run: |
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
